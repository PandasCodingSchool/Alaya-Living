services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fmr
      POSTGRES_PASSWORD: fmr
      POSTGRES_DB: findmyroommate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmr -d findmyroommate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://fmr:fmr@postgres:5432/findmyroommate
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
      WEB_ORIGIN: http://localhost:3000,http://localhost:3001
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/fmr-uploads
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: fmr-uploads
      S3_REGION: us-east-1
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
